plugins {
    id 'com.android.application'
}

android {
    namespace = 'local.bwjselector'
    compileSdk = 36

    defaultConfig {
        applicationId = 'local.bwjselector'
        minSdk = 30
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// The save edit is the same script the Termux bwj command runs.
def copyEditScript = tasks.register('copyEditScript', Copy) {
    from '../../phone/bwj-edit.sh'
    into 'src/main/assets'
}
tasks.named('preBuild') { dependsOn copyEditScript }
