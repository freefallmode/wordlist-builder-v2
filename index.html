<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordlist Builder v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="btn-home" class="brand" title="Overview">Wordlist builder <small id="version"></small></button>
  <span id="lib" class="hint"></span>
  <span class="grow"></span>
  <span id="save" class="hint"></span>
  <details id="filemenu" class="menu"><summary>File ▾</summary><div class="mpop"></div></details>
  <button id="btn-checks">Checks</button>
  <button id="btn-export">Export…</button>
  <button id="btn-settings">Settings</button>
</header>
<div id="layout">
  <aside>
    <div class="side-top">
      <input id="search" type="search" placeholder="Search themes and words" autocomplete="off">
    </div>
    <div class="tree-tools">
      <button id="btn-expand" title="Expand all">⊞ Expand all</button>
      <button id="btn-collapse" title="Collapse all">⊟ Collapse all</button>
      <button id="btn-lock" class="lock"></button>
    </div>
    <select id="tflag" title="Show only themes with a flag (including flags inherited from a parent theme), with their parents for context"></select>
    <div id="tree"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
